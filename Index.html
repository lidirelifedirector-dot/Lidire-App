<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- Responsividade para celular, tablet e computador -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Identidade visual do LiDire -->
  <meta name="theme-color" content="#070C22">
  <meta name="color-scheme" content="dark">

  <!-- SEO / compartilhamento -->
  <meta
    name="description"
    content="LiDire — Seu Copiloto para a Vida. Organize sua rotina, compromissos, tarefas, estudos, treinos, compras, finanças e muito mais em um só lugar."
  >

  <meta
    name="application-name"
    content="LiDire"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="LiDire"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- Título exibido no navegador -->
  <title>LiDire — Seu Copiloto para a Vida</title>

  <!-- Fontes oficiais utilizadas na interface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos principais do aplicativo -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Cor de fundo antes do carregamento do aplicativo -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #070C22;
    }

    body {
      font-family: "Inter", sans-serif;
      color: #F7F8FF;
    }

    #app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-loading {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(123, 44, 255, 0.18),
          transparent 42%
        ),
        #070C22;
    }

    .app-loading__brand {
      font-family: "Poppins", sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(
        90deg,
        #7B2CFF,
        #2E75FF,
        #12D9D2
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-loading__text {
      color: #A9B0CA;
      font-size: 14px;
    }

    .app-loading__spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #7B2CFF;
      border-right-color: #2E75FF;
      border-radius: 50%;
      animation: lidire-spin 0.8s linear infinite;
    }

    @keyframes lidire-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading__spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!--
    Conteúdo inicial enquanto o aplicativo é carregado.
    O app.js substitui este conteúdo quando estiver pronto.
  -->
  <main
    id="app"
    aria-live="polite"
    aria-busy="true"
  >
    <section
      class="app-loading"
      aria-label="Carregando o LiDire"
    >
      <div class="app-loading__brand">
        LiDire
      </div>

      <div
        class="app-loading__spinner"
        aria-hidden="true"
      ></div>

      <div class="app-loading__text">
        Organizando sua rotina...
      </div>
    </section>
  </main>

  <!--
    Aviso para usuários que desativaram JavaScript.
    O MVP do LiDire depende de JavaScript para funcionar.
  -->
  <noscript>
    <div
      style="
        padding: 24px;
        background: #070C22;
        color: #F7F8FF;
        text-align: center;
        font-family: Inter, Arial, sans-serif;
      "
    >
      Para utilizar o LiDire, ative o JavaScript no seu navegador.
    </div>
  </noscript>

  <!-- Aplicativo principal -->
  <script
    type="module"
    src="/app.js"
  ></script>

  <!--
    Marca que o aplicativo terminou de carregar.
    O app.js pode assumir o controle do elemento #app.
  -->
  <script>
    window.addEventListener("load", () => {
      const app = document.getElementById("app");

      if (app) {
        app.setAttribute("aria-busy", "false");
      }
    });
  </script>

</body>
</html>
